services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://dev:password@app-db:5432/app_db
    depends_on:
      pulp-db:
        condition: service_healthy
    networks:
      - app-network

  app-db:
    image: postgres:18
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: "app_db"
      POSTGRES_USER: "dev"
      POSTGRES_PASSWORD: "password"
    volumes:
      - app_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d app_db"]
      interval: 10s
      retries: 5
      timeout: 5s
      start_period: 30s
    networks:
      - app-network
    restart: always

networks:
  app-network:
    driver: bridge

volumes:
  app_db_data:
