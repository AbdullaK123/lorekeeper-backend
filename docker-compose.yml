services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://dev:password@app-db:5432/app_db
      MEMGRAPH_URI: bolt://app-memgraph:7687
    depends_on:
      app-db:
        condition: service_healthy
      app-memgraph:
        condition: service_healthy
    networks:
      - app-network

  app-db:
    image: postgres:18
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: "app_db"
      POSTGRES_USER: "dev"
      POSTGRES_PASSWORD: "password"
    volumes:
      - app_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d app_db"]
      interval: 10s
      retries: 5
      timeout: 5s
      start_period: 30s
    networks:
      - app-network
    restart: always

  app-memgraph:
    image: memgraph/memgraph
    ports:
      - "7687:7687"
      - "7444:7444"
    volumes:
      - memgraph_data:/var/lib/memgraph
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 0;' | mgconsole || exit 1"]
      interval: 10s
      retries: 5
      timeout: 5s
      start_period: 10s
    networks:
      - app-network
    restart: always

networks:
  app-network:
    driver: bridge

volumes:
  app_db_data:
  memgraph_data: