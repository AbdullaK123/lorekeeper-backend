[package]
name = "lorekeeper-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = {version = "0.8.9", features=[]}
envy = "0.4.2"
tokio = {version="1.53.1", features=["full"]}
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml_bw = "2.5.8"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "uuid", "chrono"] }
