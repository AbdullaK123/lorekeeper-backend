[package]
name = "lorekeeper-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = {version = "0.8.9", features=["macros"]}
envy = "0.4.2"
tokio = { version = "1.53.1", features = ["full", "macros", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["trace", "cors", "fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml_bw = "2.5.8"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "uuid", "chrono"] }
thiserror = "2.0.20"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.26.1", features = ["serde"] }
neo4rs = "0.8.0"
serde_json = "1.0.151"
argon2 = "0.6.0"
validator = { version = "0.21.0", features = ["derive"] }
passcheck = "0.2.0"
rig = { version="0.44.0" }
schemars="1"
async-stream = "0.3.6"
futures = "0.3"
tokio-cron-scheduler = "0.15.1"
unicode-normalization = "0.1.25"
dbos = "0.5.0"
askama = "0.16.1"
resend-rs = "0.35.1"
nanoid = "0.5.0"
sha2 = "0.11.1"
hex = "0.4.3"
axum-extra = { version = "0.12.6", features = ["cookie"] }
time = "0.3"
openidconnect = "4.1.0"

# Keep source-line backtraces without full debugger variable/type information.
[profile.dev]
debug = "line-tables-only"
incremental = true
